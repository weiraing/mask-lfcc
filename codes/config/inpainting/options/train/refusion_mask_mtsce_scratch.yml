#### =====================================================================
# MTSCE 从头训练版（不使用任何预训练权重）
#
# 适用场景：想完全自己训一个模型，不用 our_model_30000 里的权重。
# 与 stage1/stage2 的区别只有三处：
#   1) path.pretrain_model_G: ~      → 不加载任何权重，全部随机初始化
#   2) train.finetune.freeze_base: false → 没有“已收敛的基网”可冻结，必须全部训练
#   3) train.niter 取原始协议的大步数（700000），因为是从零开始
# 因此从头训练**不需要分两阶段**：stage1 的“冻结基网只训新模块”在没有预训练基网时没有意义。
#
# 运行方式（必须在 codes/config/inpainting 目录下执行）：
#   cd codes/config/inpainting
#   python train.py -opt=options/train/refusion_mask_mtsce_scratch.yml
#
# 产出：experiments/inpainting/refusion_mask_mtsce_scratch/models/
#         <iter>_G.pth / lastest_EMA.pth / latest_G.pth
#
# ---------------------------------------------------------------------
# 如果目的是“论文里 B/C 公平对比”，推荐这样做（而不是直接从头训 C）：
#   1) 先把 B 基线从头训出来：复制 options/train/refusion_mask.yml，
#      把 path.pretrain_model_G 改成 ~，改个 name，训练；
#   2) 再把 stage1 的 pretrain_model_G 指向第 1 步产出的权重，走 stage1 → stage2。
#   这样 B 和 C 的初始化方式、训练步数完全一致，比较才可解释。
# ---------------------------------------------------------------------
name: refusion_mask_mtsce_scratch_dark
use_tb_logger: true
model: denoising
distortion: derain
gpu_ids: [0]

sde:
  max_sigma: 50
  T: 100
  schedule: cosine # linear, cosine
  eps: 0.005

degradation: # for some synthetic dataset that only have GTs
  # for denoising
  sigma: 25
  noise_type: G # Gaussian noise: G

  # for super-resolution
  scale: 4

#### datasets
datasets:
  train:
    optimizer: Lion # Adam, AdamW, Lion
    name: Train_Dataset
    mode: LQGTMask # LQGT + 显式退化掩码（1 = 缺损区，0 = 完整区）
    dataroot_GT: datasets/dark/train/images
    dataroot_LQ: datasets/dark/train/masked_images
    dataroot_mask: datasets/dark/train/masks

    use_shuffle: true
    n_workers: 4  # per GPU
    batch_size: 16
    GT_size: 128
    LR_size: 128
    use_flip: true
    use_rot: true
    color: RGB

  val:
    # 训练中监控用 3 张图（约 40 秒/次）；全量 val 604 张、T=100，一次约 2 小时，
    # 只适合训练结束后用 test.py 离线评测。想改全量就换成注释里的三行。
    name: Val_Dataset
    mode: LQGTMask
    #dataroot_GT: datasets/dark/val_smoke/images
    #dataroot_LQ: datasets/dark/val_smoke/masked_images
    #dataroot_mask: datasets/dark/val_smoke/masks
    dataroot_GT: datasets/dark/val/images
    dataroot_LQ: datasets/dark/val/masked_images
    dataroot_mask: datasets/dark/val/masks

#### network structures
network_G:
  which_model_G: ConditionalNAFNet
  setting:
    width: 64
    enc_blk_nums: [1, 1, 1, 28]
    middle_blk_num: 1
    dec_blk_nums: [1, 1, 1, 1]

    # 从头训练时掩码通道同样打开（与 B 基线保持一致，才能只比较 MTSCE 的作用）
    use_mask: true

    # =================================================================
    # MTSCE：多尺度纹理与结构协同增强模块（逐项说明见 MTSCE_IMPLEMENTATION.md §7）
    # =================================================================
    mtsce:
      # 总开关。false 时不构建任何子模块，等价基线（消融 D1）
      enabled: true

      # 插入位置：bottleneck（方案位置 A）/ encoder_1..4 / decoder_1..4；
      # 位置 A+B 写 [bottleneck, decoder_4]。名字写错会报错并列出合法值。
      insertion_points: [bottleneck]

      # 分支宽度 = round(通道数 × ratio)：0.5 → +9.72M(+12.69%)，0.25 → +2.70M(+3.52%)
      hidden_ratio: 0.5

      # 分支宽度下限，一般不用改
      min_hidden: 8

      # 结构分支并行空洞率；纹理细时不要 ≥4，[1] 退化为单尺度
      structure_dilations: [1, 2, 3]

      # 纹理分支深度可分离卷积核，必须正奇数
      texture_kernel_size: 3

      # 结构分支开关（D3 消融设 false）
      use_structure: true

      # 纹理分支开关（D2 消融设 false）
      use_texture: true

      # 纹理分支是否用 GroupNorm
      texture_norm: true

      # 融合方式：adaptive（掩码感知，D5）/ mean（平均，D4）/ add（相加，D4）
      fusion: adaptive

      # 融合门控是否吃掩码 E(Ms)（false = 无掩码先验对照）
      use_mask_condition: true

      # 掩码嵌入通道数（二值掩码 8 足够）
      mask_feat_ch: 8

      # 掩码极性：false = 1 为缺损区（本项目约定）
      mask_invert: false

      # 可学习残差系数 alpha 初值
      residual_scale_init: 0.1

#### path
path:
  # 关键：~ 表示不加载任何预训练权重，网络全部随机初始化（strict_load 此时不起作用）
  pretrain_model_G: ~
  # 续训（恢复优化器/调度器/迭代数）用的是 resume_state，不是 pretrain_model_G，见文末说明
  resume_state: ~
  strict_load: true

#### training settings: learning rate scheme, loss
train:
  optimizer: Lion # Adam, AdamW, Lion
  lr_G: !!float 4e-5
  lr_scheme: TrueCosineAnnealingLR
  beta1: 0.9
  beta2: 0.99
  # 从头训练用原始协议的大步数；算力有限可以按损失曲线收敛情况减小（例如 300000）
  niter: 700000
  warmup_iter: -1  # no warm up
  lr_steps: [200000, 400000, 600000]
  lr_gamma: 0.5
  eta_min: !!float 1e-7

  # ---------------------------------------------------------------------
  # 从头训练：没有可冻结的基网，基网与 MTSCE 一起训练
  # ---------------------------------------------------------------------
  finetune:
    # 必须 false：从头训练时冻结基网会让“随机初始化的基网 + 只有 MTSCE 在学”毫无意义
    freeze_base: false
    # 与 lr_G 相同；想让新模块学得更快可单独调大（会自动分成两个参数组）
    lr_mtsce: !!float 4e-5

  # criterion（保持原样）
  is_weighted: False
  loss_type: l1
  weight: 1.0

  manual_seed: 0
  # 每 5000 步在 3 张图上验证一次（约 40 秒）
  val_freq: !!float 5e3

#### logger
logger:
  print_freq: 100
  # 每次存盘写 2 个文件（G + EMA，各约 345MB）。700000 步、每 20000 步存一次
  # ≈ 35 次 ≈ 24GB；磁盘紧张就调大到 50000（≈ 14 次 ≈ 10GB）
  save_checkpoint_freq: !!float 2e4

# =====================================================================
# 三种“从哪儿开始”的配置方式速查
# ---------------------------------------------------------------------
# 1) 从头训练（随机初始化）：本文件
#      pretrain_model_G: ~      freeze_base: false      niter: 700000
#
# 2) 用已有权重做初始化（只加载权重，优化器/调度器/迭代数都是新的）：
#      pretrain_model_G: 某个 xxx_G.pth 或 lastest_EMA.pth
#      这就是 stage1（加载 30000_G.pth）的做法；加载时只允许 mtsce.* 缺失。
#
# 3) 中断后继续训练（连优化器、学习率、迭代数一起恢复）：
#      resume_state: experiments/inpainting/<name>/training_state/<iter>.state
#      此时 pretrain_model_G 会被自动改写成同目录 models/<iter>_G.pth（见 options.check_resume），
#      不需要也不要再手填 pretrain_model_G。
# =====================================================================
