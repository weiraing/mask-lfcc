#### =====================================================================
# MTSCE 阶段一：预热新增模块（冻结基网，只训练 MTSCE）
#
# 运行方式（必须在 codes/config/inpainting 目录下执行，数据集路径是相对该目录的）：
#   cd codes/config/inpainting
#   python train.py -opt=options/train/refusion_mask_mtsce_stage1.yml
#
# 产出：experiments/inpainting/refusion_mask_mtsce_s1/models/
#         5000_G.pth / 10000_G.pth / ... / latest_G.pth  （普通权重）
#         lastest_EMA.pth                                （EMA 权重，阶段二/测试优先用它）
#
# 作用：MTSCE 的输出投影是零初始化，等价于“先不改变基网输出”。本阶段只让新模块
#       学会输出有意义的残差，不破坏已收敛的基网；之后再用 stage2 联合微调。
#       只想快速验证接入是否正常时，跑 5k~20k 步足够，可随时中断取最近的检查点。
# =====================================================================
name: refusion_mask_mtsce_s1
use_tb_logger: true
model: denoising
distortion: derain
gpu_ids: [0]

sde:
  max_sigma: 50
  T: 100
  schedule: cosine # linear, cosine
  eps: 0.005

degradation: # for some synthetic dataset that only have GTs
  # for denoising
  sigma: 25
  noise_type: G # Gaussian noise: G

  # for super-resolution
  scale: 4

#### datasets
datasets:
  train:
    optimizer: Lion # Adam, AdamW, Lion
    name: Train_Dataset
    mode: LQGTMask # LQGT + 显式退化掩码（1 = 缺损区，0 = 完整区）
    dataroot_GT: datasets/dark/train/images
    dataroot_LQ: datasets/dark/train/masked_images
    dataroot_mask: datasets/dark/train/masks

    use_shuffle: true
    n_workers: 4  # per GPU
    batch_size: 4
    GT_size: 128
    LR_size: 128
    use_flip: true
    use_rot: true
    color: RGB

  val:
    # 训练中的监控验证。T=100 采样约 12s/张，全量 val（604 张）一次验证约 2 小时，
    # 不适合训练过程中频繁跑，所以这里用 3 张图的 val_smoke 做快速监控；
    # 正式指标请在训练结束后用 test.py 在全量 val 上评测
    # （options/test/refusion_mask_mtsce.yml）。想改成全量验证，把下面三行换成注释里的三行。
    name: Val_Dataset
    mode: LQGTMask
    dataroot_GT: datasets/dark/val_smoke/images
    dataroot_LQ: datasets/dark/val_smoke/masked_images
    dataroot_mask: datasets/dark/val_smoke/masks
    # dataroot_GT: datasets/dark/val/images
    # dataroot_LQ: datasets/dark/val/masked_images
    # dataroot_mask: datasets/dark/val/masks

#### network structures
network_G:
  which_model_G: ConditionalNAFNet
  setting:
    width: 64
    enc_blk_nums: [1, 1, 1, 28]
    middle_blk_num: 1
    dec_blk_nums: [1, 1, 1, 1]

    # 退化感知潜空间（Degradation-Aware Latent）：把掩码拼进网络输入 [x_t-mu, mu, mask]。
    # 必须与预训练权重一致（该权重按 use_mask: true 训练），不要改。
    use_mask: true

    # =================================================================
    # MTSCE：多尺度纹理与结构协同增强模块
    # 详细说明见 MTSCE_IMPLEMENTATION.md §7，这里逐项标注每个参数的作用
    # =================================================================
    mtsce:
      # 总开关。false 时不构建任何子模块，state_dict 与输出和基线逐比特一致（消融 D1）
      enabled: true

      # 插入位置，可多选：bottleneck（方案位置 A，默认）/ encoder_1..encoder_4 /
      # decoder_1..decoder_4（decoder_1 最深，decoder_4 分辨率最高 = 方案位置 B）。
      # 建议先只插 bottleneck；想同时用位置 B 就写 [bottleneck, decoder_4]（参数几乎不增加）。
      # 名字写错会在构建期直接报错并列出全部合法名称。
      insertion_points: [bottleneck]

      # 两个分支的宽度 = round(该层通道数 × hidden_ratio)。
      # bottleneck 是 1024 通道：0.5 → 新增 9.72M 参数(+12.69%)；0.25 → 2.70M(+3.52%)。
      # 显存/训练成本敏感时先用 0.25。
      hidden_ratio: 0.5

      # 分支宽度下限，避免插到浅层（64 通道）时过窄。一般不用改。
      min_hidden: 8

      # 结构分支的并行空洞卷积膨胀率，决定多尺度感受野。
      # 纺织品纹理很细，膨胀率不要 ≥4（采样间隔过大易产生栅格效应、漏细节）；
      # 写 [1] 就退化成单尺度结构分支。
      structure_dilations: [1, 2, 3]

      # 纹理分支深度可分离卷积的核大小，必须是正奇数。想更关注细节可试 5（参数/耗时上升）。
      texture_kernel_size: 3

      # 结构分支开关。做“仅纹理分支”消融（D3）时设 false。
      use_structure: true

      # 纹理分支开关。做“仅结构分支”消融（D2）时设 false。
      use_texture: true

      # 纹理分支是否使用 GroupNorm。若发现颜色/亮度被压平，可设 false。
      texture_norm: true

      # 融合方式：
      #   adaptive = 掩码感知自适应融合（完整方法，D5）
      #   mean     = 两个分支简单平均（D4，无门控参数）
      #   add      = 两个分支直接相加（D4 的另一种写法）
      fusion: adaptive

      # 融合门控是否接收掩码特征 E(Ms)。设 false 即“不使用掩码先验的融合”对照实验。
      use_mask_condition: true

      # 掩码嵌入 E(Ms) 的通道数。掩码是二值的，8 已经足够，一般不用改。
      mask_feat_ch: 8

      # 掩码极性。本项目数据约定 1 = 缺损区、0 = 完整区，所以保持 false；
      # 若换成 0 = 缺损区的数据，设 true 即可，不需要改数据加载代码。
      mask_invert: false

      # 可学习残差缩放系数 alpha 的初值。Proj_out 本身零初始化，所以这里只影响
      # 新模块“起步的力度”；想让初期更保守可降到 0.05。
      residual_scale_init: 0.1

#### path
path:
  # 已训练好的“掩码通道”模型权重（基网全部命中，MTSCE 部分保持零初始化）。
  # 想从 EMA 权重起步，可换成同目录下的 lastest_EMA.pth。
  pretrain_model_G: C:\Users\rain\Desktop\任务二\our_model_30000\our_model_30000\refusion_mask_dark\models\30000_G.pth
  # 严格加载：只允许 mtsce.* 缺失（新模块）或多于当前网络（消融），其它不匹配一律报错
  strict_load: true
  resume_state: ~

#### training settings: learning rate scheme, loss
train:
  optimizer: Lion # Adam, AdamW, Lion
  lr_G: !!float 4e-5
  lr_scheme: TrueCosineAnnealingLR
  beta1: 0.9
  beta2: 0.99
  niter: 20000
  warmup_iter: -1  # no warm up
  lr_steps: [200000, 400000, 600000]
  lr_gamma: 0.5
  eta_min: !!float 1e-7

  # ---------------------------------------------------------------------
  # 阶段一专用：冻结基网，只优化 MTSCE
  # ---------------------------------------------------------------------
  finetune:
    # true = 冻结除 mtsce.* 以外的全部参数（668 个基网张量），只有 31 个 MTSCE 张量可训练
    freeze_base: true
    # 单独给 MTSCE 参数组的学习率（比基网高一个量级，让新模块快速起步）；
    # 不写这一项则回落到 lr_G
    lr_mtsce: !!float 1e-4

  # criterion（保持原样，才能把 MTSCE 的作用单独隔离出来）
  is_weighted: False
  loss_type: l1
  weight: 1.0

  manual_seed: 0
  # 每 5000 步在 3 张图上验证一次（约 40 秒）；全量验证的代价见 datasets.val 的注释
  val_freq: !!float 5e3

#### logger
logger:
  print_freq: 100
  # 每次存盘写 2 个文件（G + EMA，各约 345MB），20000 步存 4 次约 2.8GB
  save_checkpoint_freq: !!float 5e3
