#### general settings
# SMOKE TEST for correction training: 300 steps, no validation, batch 4.
#
# Purpose: prove the whole path runs end to end (load frozen denoiser -> build
# corrector from it -> train -> save G and C) and that x0_gain moves, before
# spending ~5 h on the real run.
#
#   python train.py -opt=options/train/smoke_correction.yml
#
# Then check:
#   grep -E "Correction setup|Correction module built|No corrector checkpoint" \
#        experiments/inpainting/smoke_correction/train_smoke_correction_*.log
#   grep "x0_gain" experiments/inpainting/smoke_correction/train_smoke_correction_*.log | tail -5
#   ls -la experiments/inpainting/smoke_correction/models/     # 300_G.pth + 300_C.pth
#
# The cosine schedule is compressed into 300 steps, so the learning rate decays
# almost immediately -- that is fine, we are not measuring quality here.
name: smoke_correction
use_tb_logger: false
model: correction
distortion: derain
gpu_ids: [0]

sde:
  max_sigma: 50
  T: 100
  schedule: cosine # linear, cosine
  eps: 0.005

degradation:
  sigma: 25
  noise_type: G # Gaussian noise: G
  scale: 4

#### datasets
datasets:
  train:
    optimizer: Lion # Adam, AdamW, Lion
    name: Train_Dataset
    mode: LQGTMask
    dataroot_GT: datasets/dark/train/images
    dataroot_LQ: datasets/dark/train/masked_images
    dataroot_mask: datasets/dark/train/masks

    use_shuffle: true
    n_workers: 2
    batch_size: 4
    GT_size: 128
    LR_size: 128
    use_flip: true
    use_rot: true
    color: RGB
  val:
    name: Val_Dataset
    mode: LQGTMask
    dataroot_GT: datasets/dark/val/images
    dataroot_LQ: datasets/dark/val/masked_images
    dataroot_mask: datasets/dark/val/masks

#### network structures (must match the checkpoint)
network_G:
  which_model_G: ConditionalNAFNet
  setting:
    width: 64
    enc_blk_nums: [1, 1, 1, 28]
    middle_blk_num: 1
    dec_blk_nums: [1, 1, 1, 1]
    use_mask: true

#### correction
correction:
  enabled: true
  input: x0
  output: eps
  combine: residual
  gate_init: 0.0
  gate_shape: channel
  gate_activation: tanh
  proposal_injection: true
  apply_t_range: [1, 100]
  train_steps: 1
  steps: 1
  detach_input: true
  detach_skip: true
  freeze_base: true
  optimizer: AdamW
  lr_correction: !!float 1e-4
  lr_backbone_scale: !!float 0.2
  weight_decay_correction: !!float 0.0
  grad_clip: !!float 1.0
  loss_weight: !!float 1.0
  base_loss_weight: !!float 0.0

#### path
path:
  # relative to codes/config/inpainting -> <project root>/experiments/...
  pretrain_model_G: ../../../experiments/inpainting/refusion_mask/models/30000_G.pth
  pretrain_model_C: ~
  strict_load: true
  resume_state: ~

#### training settings
train:
  optimizer: Lion # Adam, AdamW, Lion
  lr_G: !!float 4e-5
  lr_scheme: TrueCosineAnnealingLR
  beta1: 0.9
  beta2: 0.99
  niter: 300
  warmup_iter: -1
  lr_steps: [200000, 400000, 600000]
  lr_gamma: 0.5
  eta_min: !!float 1e-7
  weight_decay_G: ~

  is_weighted: False
  loss_type: l1
  weight: 1.0

  manual_seed: 0
  val_freq: !!float 1e9 # effectively disabled: a 604-image eval is ~30 min

#### logger
logger:
  print_freq: 10
  save_checkpoint_freq: !!float 300
