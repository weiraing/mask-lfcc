#### general settings
# Mask-Guided Data Consistency (MGDC) — training-free sampler plug-in,
# paired with the mask-conditioned checkpoint trained by
# options/train/refusion_mask.yml. The ablation OFF baseline is
# options/test/refusion_mask.yml (identical except sde.mgdc).
name: refusion_mask_mgdc
suffix: ~  # add suffix to saved images
model: denoising
distortion: derain
gpu_ids: [0]

sde:
  max_sigma: 50
  T: 100
  schedule: cosine # linear, cosine
  eps: 0.005

  # Mask-Guided Data Consistency (no retraining, sampling-time only)
  mgdc:
    enable: true
    mode: masked_lowpass  # masked_lowpass (recommended) | global
    sigma: 4.0            # low-frequency cutoff, in pixels (Gaussian blur sigma)
    blend: 1.0            # consistency strength lambda, in (0, 1]
    schedule: constant    # constant | ramp_up | ramp_down
    support_tau: 0.05     # drop guidance where observed support < tau (thick holes)
    interval: 1           # apply guidance every k reverse steps
    final_composite: true # pin observed pixels back on the final output

degradation:
  # for denoising
  sigma: 25
  noise_type: G # Gaussian noise: G

  # for super-resolution
  scale: 4

datasets:
  test1:
    name: Val_Dataset
    mode: LQGTMask
    dataroot_GT: datasets/dark/val/images
    dataroot_LQ: datasets/dark/val/masked_images
    dataroot_mask: datasets/dark/val/masks

#### network structures
network_G:
  which_model_G: ConditionalNAFNet
  setting:
    width: 64
    enc_blk_nums: [1, 1, 1, 28]
    middle_blk_num: 1
    dec_blk_nums: [1, 1, 1, 1]
    use_mask: true # must match the trained model

#### path
path:
