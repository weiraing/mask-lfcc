#### general settings
# Smoke test: MTSCE ablation D2 (structure branch only, texture branch off).
# Note: a fair D2 run must be *trained* with use_texture: false; at the
# zero-initialised stage every variant is identical to the baseline.
name: smoke_mtsce_struct_only
suffix: ~  # add suffix to saved images
model: denoising
distortion: derain
gpu_ids: [0]

sde:
  max_sigma: 50
  T: 100
  schedule: cosine # linear, cosine
  eps: 0.005

  mgdc:
    enable: false

degradation:
  sigma: 25
  noise_type: G
  scale: 4

datasets:
  test1:
    name: Val_Dataset
    mode: LQGTMask
    dataroot_GT: datasets/dark/val_smoke/images
    dataroot_LQ: datasets/dark/val_smoke/masked_images
    dataroot_mask: datasets/dark/val_smoke/masks

#### network structures
network_G:
  which_model_G: ConditionalNAFNet
  setting:
    width: 64
    enc_blk_nums: [1, 1, 1, 28]
    middle_blk_num: 1
    dec_blk_nums: [1, 1, 1, 1]
    use_mask: true

    mtsce:
      enabled: true
      insertion_points: [bottleneck]
      hidden_ratio: 0.5
      structure_dilations: [1, 2, 3]
      texture_kernel_size: 3
      use_structure: true
      use_texture: false
      fusion: adaptive
      use_mask_condition: true
      residual_scale_init: 0.1

#### path
path:
  pretrain_model_G: C:\Users\rain\Desktop\任务二\our_model_30000\our_model_30000\refusion_mask_dark\models\lastest_EMA.pth
  strict_load: true
